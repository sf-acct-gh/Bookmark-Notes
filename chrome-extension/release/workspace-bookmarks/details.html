<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Bookmark details</title>
		<link rel="stylesheet" href="styles.css" />
		<style>
			body {
				width: auto;
				max-height: none;
				padding: 1rem;
			}
			h1 {
				font-size: 1rem;
				margin: 0 0 0.5rem;
				word-break: break-word;
			}
			.field-label {
				font-size: 0.75rem;
				text-transform: uppercase;
				color: #6b7280;
				margin: 0.75rem 0 0.15rem;
			}
			.field-value {
				word-break: break-word;
				white-space: pre-wrap;
			}
			.close-row {
				margin-top: 1rem;
				text-align: right;
			}
			.close-row button {
				border: 1px solid #d1d5db;
				background: #f9fafb;
				border-radius: 4px;
				padding: 0.35rem 0.9rem;
				cursor: pointer;
				font: inherit;
			}
			.close-row button:hover {
				background: #e5e7eb;
			}
		</style>
	</head>
	<body>
		<h1 id="name">Bookmark</h1>

		<div class="field-label">URL</div>
		<div class="field-value" id="url"></div>

		<div class="field-label" id="notes-label" hidden>Notes</div>
		<div class="field-value" id="notes" hidden></div>

		<div class="close-row">
			<button id="close-btn" type="button">Close</button>
		</div>

		<script src="utils.js"></script>
		<script src="details.js"></script>
	</body>
</html>
